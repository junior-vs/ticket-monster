# ============================================================
# Application
# ============================================================
quarkus.application.name=catalog-service
quarkus.http.port=8080

# ============================================================
# Datasource
# ============================================================
quarkus.datasource.db-kind=postgresql

# DEV: Postgres via Dev Services
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.db-name=catalog_db
%dev.quarkus.datasource.devservices.username=catalog_user
%dev.quarkus.datasource.devservices.password=catalog_pass
# opcional: fixar porta (evite se já usa 5432 localmente)
# %dev.quarkus.datasource.devservices.port=5432

# PROD: banco externo
%prod.quarkus.datasource.username=${CATALOG_DB_USER:catalog_user}
%prod.quarkus.datasource.password=${CATALOG_DB_PASSWORD:catalog_pass}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog_db}
%prod.quarkus.datasource.reactive.url=postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog_db}

quarkus.hibernate-orm.schema-management.strategy=none

# ============================================================
# Liquibase
# ============================================================
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# ============================================================
# Redis
# ============================================================
# DEV: Redis via Dev Services
%dev.quarkus.redis.devservices.enabled=true
# opcional: %dev.quarkus.redis.devservices.port=6379

# PROD: Redis externo
%prod.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# ============================================================
# OIDC / Keycloak
# ============================================================
# DEV: Keycloak via Dev Services
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.realm-path=keycloak/ticketmonster-realm.json
%dev.quarkus.oidc.application-type=service
%dev.quarkus.oidc.client-id=catalog-service
%dev.quarkus.oidc.credentials.secret=catalog-service-secret
# não definir auth-server-url no dev (Dev Services injeta automaticamente)

# PROD: Keycloak externo
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/ticketmonster
%prod.quarkus.oidc.client-id=catalog-service
%prod.quarkus.oidc.credentials.secret=${CATALOG_CLIENT_SECRET:catalog-service-secret}
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_URL:http://localhost:8081}/realms/ticketmonster
%prod.quarkus.oidc.application-type=service

# GET /api/v1/event-categories is public (spec 009, extension item 1)
quarkus.http.auth.permission.public.paths=/api/v1/event-categories
quarkus.http.auth.permission.public.methods=GET
quarkus.http.auth.permission.public.policy=permit

# Administrative writes require ROLE_ADMIN
quarkus.http.auth.policy.admin-policy.roles-allowed=ROLE_ADMIN
quarkus.http.auth.permission.admin.paths=/api/v1/admin/event-categories,/api/v1/admin/event-categories/*
quarkus.http.auth.permission.admin.methods=POST,PUT,DELETE
quarkus.http.auth.permission.admin.policy=admin-policy

# ============================================================
# Test profile
# ============================================================
%test.quarkus.oidc.enabled=false
%test.quarkus.liquibase.migrate-at-start=true
