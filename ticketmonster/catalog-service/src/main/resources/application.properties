# ============================================================
# Application
# ============================================================
quarkus.application.name=catalog-service
quarkus.http.port=8080

# ============================================================
# Datasource - PostgreSQL (catalog_db)
#   reactive.url -> Hibernate Reactive / Panache
#   jdbc.url     -> Liquibase (requires a JDBC pool)
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${CATALOG_DB_USER:catalog_user}
quarkus.datasource.password=${CATALOG_DB_PASSWORD:catalog_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog_db}
quarkus.datasource.reactive.url=postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME:catalog_db}

# Hibernate Reactive - schema is managed exclusively by Liquibase
quarkus.hibernate-orm.schema-management.strategy=none

# ============================================================
# Liquibase
# ============================================================
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# ============================================================
# Redis - cache-aside (key catalog:categories:list)
# ============================================================
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# ============================================================
# OIDC - Keycloak (RBAC ROLE_ADMIN on writes)
# ============================================================
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/ticketmonster
quarkus.oidc.client-id=catalog-service
quarkus.oidc.credentials.secret=${CATALOG_CLIENT_SECRET:catalog-service-secret}
quarkus.oidc.token.issuer=${KEYCLOAK_URL:http://localhost:8081}/realms/ticketmonster
quarkus.oidc.application-type=service

# GET /api/v1/event-categories is public (spec 009, extension item 1)
quarkus.http.auth.permission.public.paths=/api/v1/event-categories
quarkus.http.auth.permission.public.methods=GET
quarkus.http.auth.permission.public.policy=permit

# Administrative writes require ROLE_ADMIN
quarkus.http.auth.policy.admin-policy.roles-allowed=ROLE_ADMIN
quarkus.http.auth.permission.admin.paths=/api/v1/admin/event-categories,/api/v1/admin/event-categories/*
quarkus.http.auth.permission.admin.methods=POST,PUT,DELETE
quarkus.http.auth.permission.admin.policy=admin-policy

# ============================================================
# Test profile
# ============================================================
%test.quarkus.oidc.enabled=false
%test.quarkus.liquibase.migrate-at-start=false
