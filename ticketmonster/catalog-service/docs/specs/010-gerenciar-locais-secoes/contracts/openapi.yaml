openapi: 3.1.0
info:
  title: TicketMonster Catalog Venue API
  version: 1.0.0
  description: REST contract for US-CAT-10 Venue and Section management.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Venues
  - name: Sections
paths:
  /venues:
    get:
      tags: [Venues]
      summary: List public venues
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged venues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuePage'
    post:
      tags: [Venues]
      summary: Create a venue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueWrite'
      responses:
        '201':
          description: Venue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /venues/{venueId}:
    get:
      tags: [Venues]
      summary: Get venue detail
      security: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Venue detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Venues]
      summary: Replace venue data
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueWrite'
      responses:
        '200':
          description: Venue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Venues]
      summary: Delete a venue and cascade its sections
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '204':
          description: Venue deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /venues/{venueId}/sections:
    get:
      tags: [Sections]
      summary: List sections for a venue
      security: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Venue sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Section'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sections]
      summary: Create a section under a venue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionWrite'
      responses:
        '201':
          description: Section created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sections/{sectionId}:
    get:
      tags: [Sections]
      summary: Get section detail
      security: []
      parameters:
        - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: Section detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sections]
      summary: Replace section data
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionWrite'
      responses:
        '200':
          description: Section updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Sections]
      summary: Delete one section
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SectionId'
      responses:
        '204':
          description: Section deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VenueId:
      name: venueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user is not allowed to perform the operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Unique or relational constraint conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    VenueWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        addressLine:
          type: string
          maxLength: 255
          nullable: true
        city:
          type: string
          maxLength: 120
          nullable: true
        state:
          type: string
          maxLength: 120
          nullable: true
        postalCode:
          type: string
          maxLength: 20
          nullable: true
        country:
          type: string
          maxLength: 120
          nullable: true
    Venue:
      allOf:
        - $ref: '#/components/schemas/VenueWrite'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    VenuePage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    SectionWrite:
      type: object
      required: [name, numberOfRows, rowCapacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        numberOfRows:
          type: integer
          minimum: 1
        rowCapacity:
          type: integer
          minimum: 1
    Section:
      allOf:
        - $ref: '#/components/schemas/SectionWrite'
        - type: object
          required: [id, venueId, capacity]
          properties:
            id:
              type: string
              format: uuid
            venueId:
              type: string
              format: uuid
            capacity:
              type: integer
              minimum: 1
              readOnly: true
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
