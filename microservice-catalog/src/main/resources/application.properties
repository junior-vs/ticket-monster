quarkus.application.name=microservice-catalog
quarkus.http.port=8080

## PostgreSQL / Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
%des.quarkus.liquibase.contexts=des
quarkus.hibernate-orm.database.default-schema=catalog
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${CATALOG_DB_USER:catalog_user}
%prod.quarkus.datasource.password=${CATALOG_DB_PASSWORD:catalog_password}
%prod.quarkus.datasource.jdbc.url=${CATALOG_JDBC_URL:jdbc:postgresql://localhost:5432/catalog_db}
%prod.quarkus.datasource.reactive.url=${CATALOG_REACTIVE_URL:postgresql://localhost:5432/catalog_db}
quarkus.datasource.reactive.max-size=${CATALOG_DB_POOL_SIZE:20}

## Redis cache-aside namespace used by catalog reads.
%prod.quarkus.redis.hosts=${CATALOG_REDIS_URL:redis://localhost:6379/0}
catalog.cache.key-prefix=${CATALOG_CACHE_KEY_PREFIX:catalog}
catalog.cache.event-ttl=${CATALOG_CACHE_EVENT_TTL:PT1H}

## Keycloak / OIDC token relay validation via realm JWKS.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/ticketmonster}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:catalog-service}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:catalog-service-secret}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${OIDC_TOKEN_AUDIENCE:catalog-service}
%dev.quarkus.keycloak.devservices.enabled=true
quarkus.keycloak.devservices.realm-path=infra/keycloak/ticketmonster-realm.json


## Kafka is shared platform infra. Catalog publishes catalog changes for cache invalidation/snapshots.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.catalog-events.connector=smallrye-kafka
mp.messaging.outgoing.catalog-events.topic=catalog-events
mp.messaging.outgoing.catalog-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

## OpenTelemetry and Prometheus metrics.
quarkus.otel.enabled=${OTEL_ENABLED:true}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.name=microservice-catalog,service.namespace=ticketmonster
quarkus.micrometer.export.prometheus.enabled=true

%dev.quarkus.datasource.devservices.enabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.otel.enabled=false
%test.quarkus.liquibase.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false
