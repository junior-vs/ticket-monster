name: ticketmonster-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketmonster-postgres
    environment:
      POSTGRES_USER: ticketmonster_admin
      POSTGRES_PASSWORD: ticketmonster_admin
      POSTGRES_DB: ticketmonster_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketmonster_admin -d ticketmonster_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketmonster-platform

  redis:
    image: redis:7.2-alpine
    container_name: ticketmonster-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketmonster-platform

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ticketmonster-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/ticketmonster-realm.json:/opt/keycloak/data/import/ticketmonster-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - ticketmonster-platform

  kafka:
    image: bitnami/kafka:3.8
    container_name: ticketmonster-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_KRAFT_CLUSTER_ID: 7JxQ1b3sT0Kp9Gd3y9xA2Q
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - ticketmonster-platform

  kafka-init:
    image: bitnami/kafka:3.8
    container_name: ticketmonster-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/ticketmonster/kafka/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/ticketmonster/kafka/create-topics.sh:ro
    networks:
      - ticketmonster-platform

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: ticketmonster-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - ticketmonster-platform

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ticketmonster-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ticketmonster-platform

  loki:
    image: grafana/loki:3.2.1
    container_name: ticketmonster-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - ticketmonster-platform

  tempo:
    image: grafana/tempo:2.6.0
    container_name: ticketmonster-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4319:4317"
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - ticketmonster-platform

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ticketmonster-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ticketmonster-platform

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  ticketmonster-platform:
    name: ticketmonster-platform
